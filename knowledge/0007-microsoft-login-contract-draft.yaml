# DRAFT — DO NOT COMMIT TO HA-Contract yet.
#
# Contract draft for the Microsoft-login mapping endpoints of
# HRPAuth-Yggdrasil-API, accompanying knowledge entry 0007 of SamuelClient.
# Author decision 2026-11: lands in HA-Contract
# docs/api/openapi/hrpauth-yggdrasil-business.yaml (version bump + drift
# verification) only after the Azure application passes Mojang's allowlist
# review. Until then this file is the single working copy.
#
# Conventions follow the existing hrpauth-yggdrasil-business.yaml:
#   - Yggdrasil protocol surface keeps the Mojang error envelope
#     {error, errorMessage, cause}.
#   - /player business wrappers keep the HA business envelope
#     {code, message, data} with BearerAuth (core OAuth2 access token or
#     Yggdrasil access token, resolved like /player/mojang-bind-enable).

openapi: 3.0.3
info:
  title: DRAFT Microsoft-login mapping endpoints (HRPAuth-Yggdrasil-API)
  version: 0.0.1-draft
  description: >
    Maps a genuine Microsoft/Mojang identity onto an HA account. The client
    performs the Microsoft OAuth chain itself (out of scope for this
    contract) and presents the resulting Minecraft Services access token; the
    server re-verifies that token against api.minecraftservices.com and never
    trusts client-supplied uuid/name claims.

paths:
  /authserver/microsoft:
    post:
      summary: Exchange a Minecraft Services access token for a Yggdrasil session
      description: >
        Auth level: none (the MC access token is the credential), rate-limited
        with the same Redis counter as /authserver/authenticate.

        Server-side re-verification: GET
        https://api.minecraftservices.com/minecraft/profile with the supplied
        bearer token. Non-200 answers map to the typed errors below; on 200
        the profile id becomes the mojang_uuid binding key.

        Decision tree on the resolved mojang_uuid:
          1. Already linked to an account: issue a session for that account
             (idempotent by uuid), respond with its profiles. haBound=true.
          2. Not linked and allowProxyRegister=false: respond 403
             MicrosoftAccountUnboundException (no state change).
          3. Not linked and allowProxyRegister=true: apply the
             POST /internal/proxy-register decision tree (idempotent hit /
             mbe-window completion / new cbh=0 account / 409 collisions) and
             issue a session for the resulting account. haBound=false for a
             freshly created proxy account; true when an mbe-window bind
             completed onto an existing HA account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mcAccessToken]
              properties:
                mcAccessToken:
                  type: string
                  description: >
                    Minecraft Services access token obtained from
                    POST api.minecraftservices.com/authentication/login_with_xbox.
                    Never stored, never returned, never logged.
                clientToken:
                  type: string
                  description: Optional Yggdrasil client token; echoed or generated.
                allowProxyRegister:
                  type: boolean
                  default: false
                  description: >
                    Opt in to path A1 (play first, bind later): when the
                    genuine identity is unbound, create/complete a proxy
                    account instead of answering unbound.
      responses:
        '200':
          description: >
            Standard Yggdrasil authenticate response (accessToken, clientToken,
            availableProfiles, selectedProfile) extended with haBound.
          content:
            application/json:
              schema:
                type: object
                properties:
                  accessToken: { type: string }
                  clientToken: { type: string }
                  availableProfiles:
                    type: array
                    items: { $ref: '#/components/schemas/ProfileSummary' }
                  selectedProfile: { $ref: '#/components/schemas/ProfileSummary' }
                  haBound:
                    type: boolean
                    description: >
                      true when the session belongs to an account whose
                      mojang_uuid is set (pre-existing or just completed via
                      an mbe window); false for a freshly proxy-registered
                      account.
        '403':
          description: >
            Yggdrasil error envelope. error=MicrosoftAccountUnboundException
            when the identity is unbound and allowProxyRegister=false
            (cause carries "<mojangUuid>:<mojangName>" so the client can
            render guidance); error=ForbiddenOperationException with
            errorMessage minecraft_profile_missing /
            minecraft_license_not_found for the Mojang 404 sub-cases
            (license checked via entitlements only when the profile 404s);
            invalid or rejected MC token likewise maps here.
        '409':
          description: >
            Yggdrasil error envelope, only reachable with
            allowProxyRegister=true: errorMessage username_already_bound
            (name collides with a non-bindable HA account, or with an account
            bound to a different mojang_uuid).
        '429':
          description: Rate limited (same bucket as /authserver/authenticate).
        '502':
          description: Mojang upstream unavailable during re-verification.

  /player/microsoft-bind:
    post:
      summary: Bind the caller's HA account to a verified genuine identity (path A2)
      description: >
        Auth level: BearerAuth, self-service only — the caller's own account,
        resolved through a Yggdrasil or core OAuth2 token exactly like
        /player/mojang-bind-enable.

        The MC access token is re-verified against
        api.minecraftservices.com/minecraft/profile before anything is
        written. This endpoint is the client-driven successor of the mbe
        window: the user simultaneously holds HA credentials and the genuine
        session, so no opt-in window is needed. The mbe mechanism stays for
        server-side absorption (WinnerProxy path).
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mcAccessToken]
              properties:
                mcAccessToken:
                  type: string
      responses:
        '200':
          description: >
            Success; data is the player summary (uid, account_id, mbe,
            mojang_uuid, cbh) with mojang_uuid now set. Idempotent when the
            same uuid is already bound to the caller.
        '400':
          description: >
            Business envelope. Codes: invalid_request (missing body),
            minecraft_verification_failed (Mojang rejected the token),
            minecraft_profile_missing, minecraft_license_not_found.
        '401': { description: Missing or invalid bearer token. }
        '409':
          description: >
            Business envelope. Codes: mojang_uuid_already_bound (the caller's
            account is bound to a different uuid — unbind first),
            mojang_uuid_bound_to_another_account (the uuid belongs to another
            account — operator force-bind territory).
        '502':
          description: Mojang upstream unavailable during re-verification.

  /player/microsoft-unbind:
    post:
      summary: Clear the caller's mojang_uuid binding
      description: >
        Auth level: BearerAuth, self-service only (same resolution as
        microsoft-bind). Clears accounts.mojang_uuid of the caller's account.
        Idempotent: unbinding an unbound account succeeds. Never deletes the
        account or profile. Documented consequence surfaced by clients: after
        unbinding, joining with the genuine client lets WinnerProxy absorb the
        player as a fresh cbh=0 proxy account again.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: >
            Success; data is the player summary with mojang_uuid null.
        '401': { description: Missing or invalid bearer token. }

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: >
        Core OAuth2 access token or Yggdrasil access token, resolved the same
        way as the existing /player endpoints (services/player_service.go
        ResolveAccount).
  schemas:
    ProfileSummary:
      type: object
      properties:
        id: { type: string, description: 32-hex profile uuid }
        name: { type: string }
