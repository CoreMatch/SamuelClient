# Minimal CI for SamuelClient (ADR-0004 follow-up): build, vet, and test only.
# It never publishes artifacts.
#
# Order matters:
#   1. main.go embeds all:frontend/dist, so a stub dist must exist before
#      any Go compilation — `wails generate module` already compiles the
#      module, hence the "Stub frontend dist" step below.
#   2. `wails generate module` produces frontend/wailsjs (gitignored), which
#      the frontend TypeScript imports.
#   3. `npm run build` produces the real frontend/dist (replacing the stub).
#   4. Only then can `go build/vet/test` compile package main.
# Plain `go build` (no production/webkit tags) compiles through Wails'
# tag-gated stub, so no GTK/WebKit system packages are required here.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The frontend consumes the shared @ha/ui design system through a
      # `file:` dependency (frontend/package.json -> ../../ha-ui, i.e. a
      # sibling of this repository), so the package must exist next to the
      # workspace before `npm ci` runs. actions/checkout refuses paths
      # outside $GITHUB_WORKSPACE, hence the plain clone (public repo).
      - name: Checkout @ha/ui design system
        run: git clone --depth 1 https://github.com/CoreMatch/ha-ui.git ../ha-ui

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Stub frontend dist for embed
        run: |
          mkdir -p frontend/dist
          touch frontend/dist/.gitkeep

      - name: Generate Wails bindings
        run: wails generate module

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # The frontend type-checks follow @ha/ui imports into its sources, so
      # the design system's own dependencies (react types, radix, lucide)
      # must be installed as well.
      - name: Install @ha/ui dependencies
        run: cd ../ha-ui && npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Frontend tests
        working-directory: frontend
        run: npm test

      - name: Go build
        run: go build ./...

      - name: Go vet
        run: go vet ./...

      - name: Go test
        run: go test ./...
